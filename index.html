<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scorme — College Soccer Recruiting Platform</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --card: #1a1a26;
      --border: #2a2a3a;
      --accent: #4f8ef7;
      --accent2: #7c4dff;
      --text: #e8e8f0;
      --muted: #8888a0;
      --success: #3ecf8e;
      --danger: #ff5c5c;
    }
    body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
    nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .nav-brand { font-size: 1.4rem; font-weight: 700; color: var(--text); }
    .hero { text-align: center; padding: 80px 24px; }
    .hero h1 { font-size: 3rem; font-weight: 800; margin-bottom: 16px; }
    .college-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; padding: 40px; }
    .college-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
    .btn { padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; background: var(--accent); color: white; display: inline-block; margin-top: 10px; }
  </style>
</head>
<body>
<nav><div class="nav-brand">scor<span>me</span></div></nav>
<section class="hero"><h1>Find Your College Soccer Program</h1></section>
<div class="college-grid" id="college-grid"></div>
<script>
const colleges = [
  { name: "University of North Carolina", code: "UNC", division: "D1", coachEmail: "coach@unc-soccer.edu" },
  { name: "UCLA", code: "UCLA", division: "D1", coachEmail: "recruiting@ucla.edu" }
];
const grid = document.getElementById('college-grid');
grid.innerHTML = colleges.map(c => `
  <div class="college-card">
    <h3>${c.name}</h3>
    <p>${c.division}</p>
    <a class="btn" href="mailto:${c.coachEmail}?subject=Recruiting&body=I am interested in your program.">Contact Coach</a>
  </div>
`).join('');
</script>
</body>
</html>
